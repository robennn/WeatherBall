[package]
name = "weatherball-native"
version = "0.3.8"
edition = "2021"
description = "Minimal transparent weather orb prototype (no WebView)"

[dependencies]
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.30"
glow = "0.16"
tray-icon = "0.19"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
